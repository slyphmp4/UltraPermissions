name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify components and security
        shell: bash
        run: bash ./gradlew --no-daemon clean build --offline --no-build-cache --console=plain
      - name: Upload plugin and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UltraPermissions-${{ runner.os }}
          path: |
            build/libs/*.jar
            build/reports/components/verification.json
            build/reports/security/verification.json
            build/reports/security/command-reference.tsv
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: UltraPermissions-Linux
          path: build/release
      - name: Package release
        shell: bash
        run: |
          version=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)
          test "$GITHUB_REF_NAME" = "v$version"
          git archive --format=zip --prefix=UltraPermissions/ --output="build/release/UltraPermissions-$version-Gradle-project.zip" HEAD
          cd build/release
          sha256sum libs/*.jar *.zip | sed 's|  libs/|  |' > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)
          notes=build/release/RELEASE-NOTES.md
          printf '%s\n\n' '[English](#english) · [Українська](#українська) · [Русский](#русский)' > "$notes"
          for language in en uk ru; do
            case "$language" in
              en) label=English; suffix= ;;
              uk) label=Українська; suffix=.uk ;;
              ru) label=Русский; suffix=.ru ;;
            esac
            printf '## %s\n\n' "$label" >> "$notes"
            tail -n +3 "docs/releases/$version$suffix.md" >> "$notes"
            printf '\n\n' >> "$notes"
          done
          gh release create "$GITHUB_REF_NAME" build/release/libs/*.jar build/release/*.zip build/release/SHA256SUMS.txt \
            --title "UltraPermissions $version" --notes-file "$notes" --verify-tag --prerelease
