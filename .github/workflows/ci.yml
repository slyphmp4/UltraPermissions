name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify components and security
        shell: bash
        run: bash ./gradlew --no-daemon clean build --offline --no-build-cache --console=plain
      - name: Verify bundled Russian and Ukrainian locales
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          version=$(sed -n "s/^version = '\\([^']*\\)'/\\1/p" build.gradle)
          python3 tools/check_localizations.py --jar "build/libs/UltraPermissions-$version.jar"
      - name: Upload plugin and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UltraPermissions-${{ runner.os }}
          path: |
            build/libs/*.jar
            build/reports/components/verification.json
            build/reports/security/verification.json
            build/reports/security/command-reference.tsv
            build/runtime-test/RuntimeProbe.jar
          if-no-files-found: error
          retention-days: 14
  compatibility:
    name: Paper 26.2 / Java 25 runtime
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: UltraPermissions-Linux
          path: build/runtime-input
      - name: Verify isolated Paper runtime
        shell: bash
        run: |
          version=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)
          python3 tools/verify_paper.py \
            --plugin "build/runtime-input/libs/UltraPermissions-$version.jar" \
            --probe build/runtime-input/runtime-test/RuntimeProbe.jar \
            --work-dir build/paper-runtime \
            --report-dir build/reports/runtime \
            --accept-eula
      - name: Upload runtime verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paper-26.2-runtime
          path: build/reports/runtime/
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: UltraPermissions-Linux
          path: build/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Paper-26.2-runtime
          path: build/release/runtime
      - name: Package release
        shell: bash
        run: |
          version=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)
          test "$GITHUB_REF_NAME" = "v$version"
          git archive --format=zip --prefix=UltraPermissions/ --output="build/release/UltraPermissions-$version-Gradle-project.zip" HEAD
          cp build/release/runtime/verification.json build/release/runtime-verification.json
          cd build/release
          sha256sum libs/*.jar *.zip runtime-verification.json | sed 's|  libs/|  |' > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)
          notes=build/release/RELEASE-NOTES.md
          python3 tools/render_release_notes.py "$version" "$notes"
          assets=(build/release/libs/*.jar build/release/*.zip build/release/runtime-verification.json build/release/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A tag published through GitHub's Release UI already has a release.
            # Attach only missing artifacts so re-runs never delete uploaded files.
            for asset in "${assets[@]}"; do
              asset_name="${asset##*/}"
              if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
                echo "Already uploaded: $asset_name"
              else
                gh release upload "$GITHUB_REF_NAME" "$asset"
              fi
            done
            gh release edit "$GITHUB_REF_NAME" --title "UltraPermissions $version" --notes-file "$notes" --latest
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "UltraPermissions $version" --notes-file "$notes" --verify-tag --latest
          fi
